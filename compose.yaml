services:
  terrarium:
    build: .
    init: true
    ports:
      - "127.0.0.1:8700:8700"
    volumes:
      - terrarium-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  terrarium-data:
